# MediaMTX config used *inside* the all-in-one Docker image to serve the
# built-in demo streams on localhost only (not exposed publicly).
logLevel: warn
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no
paths:
  all_others:
